# Cloudflare Pages: o site estático mais as Functions de `functions/`.
#
# Nenhum segredo mora aqui. Com `resend` ativo, o v0 usa três:
# `TURNSTILE_SECRET`, `RESEND_API_KEY` e `EMAIL_CONTATO`, todos por
# `wrangler pages secret put <NOME>`. A chave PÚBLICA do Turnstile é outra
# coisa: vai no HTML, então é variável de BUILD (`PUBLIC_TURNSTILE_SITEKEY`) no
# painel do Pages. Sem os segredos, cada porta cai no seu adaptador `nenhum` —
# sem Turnstile o formulário sai sem anti-spam, sem Resend o e-mail não sai —
# de propósito, ver o README.
#
# D1 (comentários) chega na aula 5, pelo `scripts/atualizar`.

name = "meu-blog"
compatibility_date = "2026-08-15"
pages_build_output_dir = "dist"
